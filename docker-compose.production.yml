# Synora — single-VPS production topology.
#
# One box, six containers: Caddy (TLS + routing), web (Next.js), app
# (backend + workers), Postgres (pgvector), Redis, and a nightly backup.
# Every service healthchecked, restarts on failure, survives reboot, and
# nothing listens on the public interface except Caddy.
#
# Usage (documented end-to-end in docs/production/DEPLOYMENT.md):
#   1. Copy .env.production.example → .env.production, fill REQUIRED values.
#   2. docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# Migrations run automatically as a one-shot `migrate` service; see below.
#
# Both images are the repo's own Dockerfiles — the same images a PaaS would
# build, so moving hosts later is a config change, not a rewrite.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The public hostname Caddy provisions TLS for. REQUIRED.
      SYNORA_DOMAIN: ${SYNORA_DOMAIN:?set SYNORA_DOMAIN in .env.production}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # Schema gate. Runs ONCE, to completion, before anything that assumes a
  # schema starts.
  #
  # A one-shot service rather than an entrypoint step in `app`: with an
  # entrypoint, every replica races to migrate the same database on every
  # restart, and a crash-looping container re-runs migrations on each loop.
  # Here `app` waits on service_completed_successfully, so a failed migration
  # means the backend never starts — instead of starting and reporting healthy
  # against a schema that was never applied.
  #
  # `migrate deploy` only applies committed migrations. It never resets, never
  # generates, and is not `db push` — history is preserved.
  migrate:
    # Same image as `app`, named explicitly so Compose builds it once rather
    # than exporting a second identical 1.7GB copy for the migration step.
    build: .
    image: synora-app:latest
    restart: "no"
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://synora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/synora
    # `entrypoint: sh -c` on purpose, two reasons:
    #  - the Node base image's docker-entrypoint.sh execs `node "$@"` for an
    #    unrecognised first argument, so passing the CLI path directly made
    #    node try to REQUIRE the binary ("Cannot find module .../prisma").
    #  - pnpm's .bin entries are shell shims, not JS, so `node <shim>` fails
    #    even with the right path.
    # The CLI lives under the workspace package, not the workspace root: this
    # repo's pnpm layout has no /app/node_modules/.bin/prisma.
    entrypoint: ["sh", "-c"]
    command:
      - "packages/database/node_modules/.bin/prisma migrate deploy --schema packages/database/prisma/schema.prisma"
    depends_on:
      postgres:
        condition: service_healthy
    # The image bakes in a liveness probe against :3001. This container never
    # serves anything, so that probe would report unhealthy for the whole of
    # its short life and muddy `docker compose ps` during a deploy.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    build: .
    image: synora-app:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://synora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/synora
      REDIS_URL: redis://redis:6379
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health is liveness (no dependencies); /ready checks the database.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  # The frontend. Previously absent: Caddy routed page traffic to app:3000
  # while `app` only ever listened on 3001, so every non-/api request would
  # have met a closed port. Dockerfile.web already existed and was correct —
  # nothing built it.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: synora-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Baked into the browser bundle at BUILD time by Dockerfile.web; repeated
      # here only so server-side rendering agrees with it. Public by
      # definition — a secret must never appear behind a NEXT_PUBLIC_ name.
      NEXT_PUBLIC_API_URL: https://${SYNORA_DOMAIN}/api
      NEXT_PUBLIC_SITE_URL: https://${SYNORA_DOMAIN}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: synora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: synora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOT exposed to the host network. Only containers reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synora"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory is set BELOW the container limit on purpose: Redis evicting a
    # cache key is a normal Tuesday, Redis being OOM-killed by the kernel takes
    # the queue with it.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--save"
      - "300"
      - "10"
      - "--maxmemory"
      - "192mb"
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # Nightly logical backups, kept 14 days.
  #
  # HONEST SCOPE: this is a LOCAL backup. The dump lands on the same disk as
  # the database it protects, so it survives `DROP TABLE` and does not survive
  # losing the VPS. Off-host copying is deliberately absent rather than faked —
  # see SYNORA_OPERATIONS.md §10.
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    # WRITE TO A TEMP NAME, RENAME ONLY ON SUCCESS, AND RETRY SOON IF IT FAILS.
    #
    # Both halves are fixes for failures observed on this host after a reboot.
    # `pg_dump -f` creates its output file before it connects, so a dump that
    # then fails leaves a ZERO-BYTE file sitting in /backups looking exactly
    # like a backup -- and counting as one in the retention window below, where
    # it can push a real backup out. Renaming only after a clean exit means a
    # file with a backup's name is always a backup.
    #
    # The retry matters as much. On a reboot every container starts at once and
    # `depends_on` no longer sequences them, so the first dump can hit a
    # Postgres that is not accepting connections yet. The old loop slept the
    # full 86400s on failure, turning one lost race into a day with no backup
    # at all. It now retries in 5 minutes and only settles into the daily
    # rhythm once a dump has actually succeeded.
    entrypoint: >
      sh -c 'while true; do
        if pg_dump -h postgres -U synora -d synora -F c -f /backups/.in-progress.dump; then
          mv /backups/.in-progress.dump /backups/synora-$$(date +%Y%m%d-%H%M).dump;
          ls -1t /backups/synora-*.dump | tail -n +15 | xargs -r rm --;
          sleep 86400;
        else
          rm -f /backups/.in-progress.dump;
          echo "backup failed; retrying in 300s";
          sleep 300;
        fi;
      done'
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

# MEMORY BUDGET — 4 GB VPS
#
#   postgres  1024M   the one that must not be squeezed; it is the only
#                     service whose failure loses data rather than availability
#   app       1024M   Node + BullMQ workers in one process
#   web        512M   Next.js standalone is light once built
#   migrate    512M   runs to completion, then releases everything
#   redis      256M   maxmemory 192M inside it
#   caddy      128M
#   backup     128M   idle except during the nightly dump
#   ----------------
#   steady     ~3.1G  (migrate has exited by then)
#   leaving    ~0.9G  for the kernel, dockerd, sshd and headroom
#
# CPU is deliberately NOT capped. On a single vCPU a hard quota cannot create
# capacity, it can only add scheduling latency to whichever container is doing
# real work. Memory is the actual OOM risk here; CPU is contention, which the
# scheduler already handles.
#
# To scale after a VPS upgrade, raise these numbers; nothing else changes.

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
