version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synora-api-staging
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://synora:${DB_PASSWORD:-synora_staging}@postgres:5432/synora_staging
      JWT_SECRET: ${JWT_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://staging.synora.example.com}
      PORT: 3001
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - synora-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs/staging:/app/logs
    labels:
      com.synora.environment: staging
      com.synora.version: "3.0"

  postgres:
    image: postgres:16-alpine
    container_name: synora-postgres-staging
    environment:
      POSTGRES_USER: synora
      POSTGRES_PASSWORD: ${DB_PASSWORD:-synora_staging}
      POSTGRES_DB: synora_staging
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - synora-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synora"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"

  redis:
    image: redis:7-alpine
    container_name: synora-redis-staging
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_staging} --appendonly yes
    volumes:
      - redis_staging_data:/data
    networks:
      - synora-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"

  nginx:
    image: nginx:alpine
    container_name: synora-nginx-staging
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./infrastructure/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/ssl/staging:/etc/nginx/ssl:ro
      - ./logs/nginx/staging:/var/log/nginx
    depends_on:
      - api
    networks:
      - synora-staging
    restart: unless-stopped
    labels:
      com.synora.component: reverse-proxy
      com.synora.environment: staging

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local

networks:
  synora-staging:
    driver: bridge
