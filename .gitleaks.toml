title = "Synora Gitleaks Configuration"
description = "gitleaks default rules. Documented example secrets (test vectors, RFC samples, redacted audit docs) are allowlisted by fingerprint in .gitleaksignore, the only place gitleaks reads fingerprints from."

# Without this block a custom config REPLACES the built-in rules, which would scan with no rules at all.
[extend]
useDefault = true
