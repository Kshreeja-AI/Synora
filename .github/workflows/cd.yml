name: CD Pipeline

on:
  push:
    branches: [SYNORA]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  gate:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      environment: ${{ steps.vars.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          TAG="${ENV}-${SHA_SHORT}"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [gate]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        if: env.REGISTRY_AVAILABLE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          REGISTRY_AVAILABLE: ${{ secrets.GITHUB_TOKEN != '' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.gate.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.gate.outputs.environment }}-latest
          cache-from: type=gha,scope=cd-${{ needs.gate.outputs.environment }}
          cache-to: type=gha,mode=max,scope=cd-${{ needs.gate.outputs.environment }}

      - name: Smoke-test built image
        run: |
          docker run -d --name synora-cd \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e JWT_SECRET=cd-smoke-not-a-real-secret-000000000000 \
            -e NEXTAUTH_SECRET=cd-smoke-not-a-real-secret-111111111111 \
            -e STRIPE_SECRET_KEY=sk_test_cd-smoke-not-a-real-secret \
            -e STRIPE_WEBHOOK_SECRET=whsec_cd-smoke-not-a-real-secret \
            -e TOOL_SECRET_MASTER_KEY=cd-smoke-not-a-real-secret-tool-master-key-000 \
            -e DATABASE_URL=postgresql://synora:synora@127.0.0.1:5432/synora \
            -p 3001:3001 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.gate.outputs.image_tag }}"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null; then
              echo "Image healthy"
              docker rm -f synora-cd
              exit 0
            fi
            sleep 1
          done
          echo "Image did not become healthy"
          docker logs synora-cd
          docker rm -f synora-cd
          exit 1

      - name: Push image to registry
        if: env.REGISTRY_AVAILABLE == 'true'
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.gate.outputs.image_tag }}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.gate.outputs.environment }}-latest"
        env:
          REGISTRY_AVAILABLE: ${{ secrets.GITHUB_TOKEN != '' }}

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [gate, build-and-push]
    if: needs.gate.outputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run database migrations
        if: env.STAGING_DATABASE_URL != ''
        run: |
          npm install -g pnpm@10.33.0
          pnpm install --frozen-lockfile
          pnpm run db:generate
          pnpm --filter @synora/database exec prisma migrate deploy
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - id: deploy
        name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        run: |
          echo "Deploying ${{ needs.gate.outputs.image_tag }} to staging..."
          echo "url=https://staging.synora.ai" >> "$GITHUB_OUTPUT"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Post-deploy health check
        if: steps.deploy.outputs.url != ''
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Waiting for ${URL}/health..."
          for i in $(seq 1 60); do
            if curl -sf "${URL}/health" >/dev/null; then
              echo "Staging healthy"
              curl -s "${URL}/health" | python3 -m json.tool
              exit 0
            fi
            sleep 5
          done
          echo "Staging did not become healthy within 5 minutes"
          exit 1

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [gate, build-and-push]
    if: needs.gate.outputs.environment == 'production'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run database migrations
        if: env.PRODUCTION_DATABASE_URL != ''
        run: |
          npm install -g pnpm@10.33.0
          pnpm install --frozen-lockfile
          pnpm run db:generate
          pnpm --filter @synora/database exec prisma migrate deploy
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - id: deploy
        name: Deploy to production
        if: env.RAILWAY_TOKEN != ''
        run: |
          echo "Deploying ${{ needs.gate.outputs.image_tag }} to production..."
          echo "url=https://synora.ai" >> "$GITHUB_OUTPUT"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Post-deploy health check
        if: steps.deploy.outputs.url != ''
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Waiting for ${URL}/health..."
          for i in $(seq 1 60); do
            if curl -sf "${URL}/health" >/dev/null; then
              echo "Production healthy"
              curl -s "${URL}/health" | python3 -m json.tool
              exit 0
            fi
            sleep 5
          done
          echo "Production did not become healthy within 5 minutes"
          exit 1
