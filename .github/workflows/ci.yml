name: CI Pipeline

# One full pipeline per change, not two. `claude/*` was previously in the
# push list while pull_request covered the same commits, so every push to a
# PR branch ran the entire 4-job pipeline twice — measured on 2026-08-03 as
# paired duplicate runs on identical head SHAs. With ~288 commits pushed in
# the week prior, the duplication roughly doubled Actions spend and drained
# the organization's minutes. Feature branches get CI through their PR
# (opened immediately in this workflow's development model); long-lived
# branches keep push CI.
on:
  push:
    branches: [main, develop, SYNORA]
  pull_request:
    branches: [main, develop, SYNORA]

# Rapid consecutive pushes to a PR supersede each other: cancel the stale
# run and spend the minutes on the newest commit, which is the only one a
# merge decision will ever be made on. Push builds on long-lived branches
# are never cancelled — each one is a state someone may deploy from.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synora
          POSTGRES_PASSWORD: synora
          POSTGRES_DB: synora
        options: >-
          --health-cmd "pg_isready -U synora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # BullMQ-backed job queues (dataset export, evaluation runs, message
      # generation) connect to Redis unconditionally — without this service
      # every test that enqueues a job hangs until it hits vitest's test
      # timeout rather than failing fast.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for database to be ready
        env:
          PGPASSWORD: synora
        run: |
          echo "Waiting for PostgreSQL to accept connections..."
          for i in {1..60}; do
            if nc -z localhost 5432 2>/dev/null; then
              echo "PostgreSQL port is open, waiting for it to fully initialize..."
              sleep 3
              # Try a simple connection
              if timeout 10s psql -h localhost -U synora -d synora -c "SELECT 1" 2>/dev/null; then
                echo "PostgreSQL is ready"
                exit 0
              fi
              echo "Connection attempt $i/60: psql connection failed, retrying..."
            else
              echo "Attempt $i/60: PostgreSQL not responding on port 5432, retrying in 2 seconds..."
            fi
            sleep 2
          done
          echo "PostgreSQL failed to become ready after 120 seconds"
          exit 1

      - name: Generate database types
        run: pnpm run db:generate
        env:
          DATABASE_URL: postgresql://synora:synora@localhost:5432/synora

      - name: Run database migrations
        run: pnpm run db:migrate
        env:
          DATABASE_URL: postgresql://synora:synora@localhost:5432/synora

      # A production deploy applies migrations, not `db push`, so the
      # migration history — not schema.prisma — is what actually defines the
      # production database. When the two diverge, production silently gets a
      # different schema than every developer runs against. This asserts they
      # still agree; an empty diff is the only passing result.
      - name: Check migrations reproduce schema.prisma
        run: |
          set -e
          psql "postgresql://synora:synora@localhost:5432/postgres" \
            -c "DROP DATABASE IF EXISTS synora_drift_check;" \
            -c "CREATE DATABASE synora_drift_check;"
          DIFF=$(pnpm --filter @synora/database exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "postgresql://synora:synora@localhost:5432/synora_drift_check" \
            --script)
          if ! echo "$DIFF" | grep -q "This is an empty migration"; then
            echo "::error::Migration drift: applying migrations does not reproduce schema.prisma."
            echo "Add a migration for the difference below (do not edit an already-released migration):"
            echo "$DIFF"
            exit 1
          fi
          echo "No drift: migrations reproduce schema.prisma exactly."
        env:
          PGPASSWORD: synora
          DATABASE_URL: postgresql://synora:synora@localhost:5432/synora

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Verify database connectivity
        run: |
          set -e
          echo "Testing PostgreSQL connection..."
          python3 -c "
          import socket
          sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          result = sock.connect_ex(('localhost', 5432))
          sock.close()
          print('Port 5432 is', 'OPEN' if result == 0 else 'CLOSED')
          exit(result)
          " || exit 1

      - name: Run tests
        run: pnpm run test:coverage
        env:
          DATABASE_URL: postgresql://synora:synora@localhost:5432/synora
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          TOOL_SECRET_MASTER_KEY: ci-only-not-a-real-secret-tool-master-key-000000

      - name: Build
        run: pnpm run build

      # Coverage lands per-package (turbo runs test:coverage per workspace
      # project), never at a repo-root ./coverage — that path never existed,
      # so this step previously no-op'd silently (fail_ci_if_error: false
      # masked it) without ever uploading a real report.
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/backend/coverage/coverage-final.json,./apps/web/coverage/coverage-final.json,./packages/design-system/coverage/coverage-final.json
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @synora/web exec playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm run build
        env:
          DATABASE_URL: postgresql://synora:synora@localhost:5432/synora

      - name: Run E2E tests
        run: pnpm --filter @synora/web test:e2e
        env:
          NODE_ENV: test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/e2e/.results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    # The backend refuses to start without a reachable database
    # (`prisma.$connect()` runs before it listens), so the smoke test below needs
    # one. The container uses the host network to reach this service.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synora
          POSTGRES_PASSWORD: synora
          POSTGRES_DB: synora
        options: >-
          --health-cmd "pg_isready -U synora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    # Verifies the production image actually assembles from the Dockerfile.
    # This is the image-build check that cannot be run in a sandbox without a
    # Docker daemon; the runtime of the built artifact is covered by the
    # backend test suite booting the app in the `test` job.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: synora-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image starts and reports liveness
        run: |
          # Start the container with the required production secrets and a
          # throwaway DATABASE_URL; assert /health responds 200. This proves
          # the image's entrypoint runs (catches the ESM-extension class of
          # bug that a plain `docker build` would not).
          # CORS_ORIGINS / FRONTEND_URL / BACKEND_URL: the production boot gate refuses
          # localhost defaults. These are placeholder public-looking URLs, not secrets.
          docker run -d --name synora-ci --network host \
            -e NODE_ENV=production \
            -e APP_STAGE=production \
            -e PORT=3001 \
            -e CORS_ORIGINS=https://ci.synora.invalid \
            -e FRONTEND_URL=https://ci.synora.invalid \
            -e BACKEND_URL=https://api.ci.synora.invalid \
            -e QUEUE_ENABLED=false \
            -e JWT_SECRET=ci-only-not-a-real-secret-000000000000 \
            -e NEXTAUTH_SECRET=ci-only-not-a-real-secret-111111111111 \
            -e STRIPE_SECRET_KEY=sk_test_ci-only-not-a-real-secret \
            -e STRIPE_WEBHOOK_SECRET=whsec_ci-only-not-a-real-secret \
            -e TOOL_SECRET_MASTER_KEY=ci-only-not-a-real-secret-tool-master-key-000000 \
            -e DATABASE_URL=postgresql://synora:synora@127.0.0.1:5432/synora \
            synora-backend:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null; then
              echo "container healthy"; docker rm -f synora-ci; exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy"; docker logs synora-ci; docker rm -f synora-ci; exit 1

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can inspect the whole tree/log.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BLOCKING gate: fail the build on any high or critical vulnerability in
      # dependencies that actually ship to production. Requires no account or
      # token, so it protects every deploy out of the box. Dev-only tooling
      # (vitest/vite) is excluded via --prod because it never reaches a
      # customer; those are tracked separately, not shipped.
      - name: Audit production dependencies (blocking, high+)
        run: pnpm audit --prod --audit-level=high

      # BLOCKING gate: fail the build if any secret material is detected in the
      # tree or git history. Runs the official gitleaks OSS Docker image
      # directly (ghcr.io/gitleaks/gitleaks) — no GitHub Action license,
      # no GITHUB_TOKEN, no account. `detect` scans git history by default
      # (not passing --no-git), which is why the checkout step above uses
      # fetch-depth: 0.
      #
      # --log-opts=HEAD restricts the scan to commits reachable from the
      # checked-out ref. Without it, gitleaks walks every branch fetch-depth:0
      # pulled in locally (actions/checkout fetches all branches' history at
      # that depth, not just the checked-out one) -- so a PR's security check
      # was failing on secrets/false-positives committed on a completely
      # unrelated, unmerged branch elsewhere in the repo, not on anything in
      # that PR's own history.
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --config=/repo/.gitleaks.toml --log-opts=HEAD --exit-code 1 --verbose

      # Best-effort deeper scan. Non-blocking because it requires an account
      # token that a fresh clone will not have; the blocking gates above do not.
      # --all-projects is required because this repo has both a pnpm-lock.yaml
      # and a pnpm-workspace.yaml (a pnpm monorepo) — without it, Snyk's CLI
      # refuses to pick a project and exits with a usage error before it ever
      # reaches authentication, regardless of whether SNYK_TOKEN is set.
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        with:
          args: --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
