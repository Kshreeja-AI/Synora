# Example Kubernetes Secret + volume mount matching the layout
# apps/backend/src/secrets/sources/kubernetesSecretSource.ts expects:
# one file per secret key, under /var/run/secrets/synora/<KEY>.
#
# Never commit a real Secret manifest with `stringData`/`data` filled in —
# create it out-of-band (kubectl, sealed-secrets, external-secrets-operator,
# etc.) and reference it by name only, as below.
#
# Usage:
#   kubectl create secret generic synora-backend-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=DATABASE_URL="postgresql://user:pass@host:5432/synora"
#
#   kubectl apply -f secret.example.yaml   # the Deployment snippet below

apiVersion: v1
kind: Secret
metadata:
  name: synora-backend-secrets
  namespace: synora
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  DATABASE_URL: "REPLACE_ME"
  # Add one entry per key declared in apps/backend/src/secrets/registry.ts

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synora-backend
  namespace: synora
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synora-backend
  template:
    metadata:
      labels:
        app: synora-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/kshreeja-ai/synora-backend:latest
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_ENV
              value: "production"
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/synora
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: synora-backend-secrets
            # Each stringData key becomes its own file under the mount path,
            # e.g. /var/run/secrets/synora/JWT_SECRET — exactly what
            # KubernetesSecretSource reads.
