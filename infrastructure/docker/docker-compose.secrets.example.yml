# Example of Docker Compose's `secrets:` mechanism, matching the layout
# apps/backend/src/secrets/sources/dockerSecretSource.ts expects: one file
# per secret key, mounted at /run/secrets/<KEY> inside the container (the
# mount file name is the top-level secret's name below, so it must match a
# key in apps/backend/src/secrets/registry.ts's SECRET_CATALOG exactly).
#
# Real secret files (./secrets/*.txt below) must never be committed — add
# `infrastructure/docker/secrets/` to .gitignore and populate it locally,
# or generate the files from your CI/CD secret store at deploy time.
#
# Usage:
#   mkdir -p infrastructure/docker/secrets
#   openssl rand -base64 32 > infrastructure/docker/secrets/JWT_SECRET
#   echo -n "postgresql://user:pass@postgres:5432/synora" > infrastructure/docker/secrets/DATABASE_URL
#   docker compose -f docker-compose.secrets.example.yml up

services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      APP_ENV: production
    secrets:
      - JWT_SECRET
      - DATABASE_URL

secrets:
  JWT_SECRET:
    file: ./secrets/JWT_SECRET
  DATABASE_URL:
    file: ./secrets/DATABASE_URL
