# Prometheus scrape configuration for Synora.
#
# The backend exposes pull-based metrics at GET /metrics (prom-client).
# If METRICS_TOKEN is set on the backend, mirror it here under
# `authorization.credentials`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: synora-backend
    metrics_path: /metrics
    # authorization:
    #   type: Bearer
    #   credentials: <METRICS_TOKEN>
    static_configs:
      - targets:
          - backend:3001
